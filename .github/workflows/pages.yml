name: Deploy frontend to GitHub Pages

# 2026-11-23：站点已走阿里云公网 http://47.97.204.93/，GitHub Pages 从未启用成功。
# 原 push 自动触发只会制造失败邮件，故改为仅手动运行（workflow_dispatch）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
